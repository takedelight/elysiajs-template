name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Валидация env-схемы падает без этих переменных, даже в тестах
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      JWT_SECRET: ci-only-secret-min-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun test
